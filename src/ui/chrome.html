<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https: http: crx:;" />
<link rel="stylesheet" href="chrome.css" />
<link rel="stylesheet" href="theme.css" />
<title>NovaDM</title>
</head>
<body>
  <div id="tabstrip">
    <div id="tabs"></div>
    <div id="newtab" title="New tab (Ctrl+T)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <div id="drag-space"></div>
    <div id="winctl">
      <div class="wc" id="w-min"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14"/></svg></div>
      <div class="wc" id="w-max"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg></div>
      <div class="wc close" id="w-close"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
    </div>
  </div>

  <div id="toolbar">
    <div class="ic" id="back" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="ic" id="fwd" title="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
    <div class="ic" id="reload" title="Reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg></div>

    <div class="priv-pill" id="priv-pill" title="Private window: pages, cookies, site data and sign-ins are deleted when it closes"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="15" r="3.2"/><circle cx="17" cy="15" r="3.2"/><path d="M10.2 15h3.6M3 11l2-5h14l2 5"/></svg>Private</div>
    <div id="omnibox">
      <span class="lock" id="lock"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      <span class="site-chip hidden" id="site-chip"></span>
      <input id="url" type="text" placeholder="Search or enter address" spellcheck="false" autocomplete="off" />
      <span class="tab-hint hidden" id="tab-hint"></span>
      <div class="obtn hidden" id="reader-btn" title="Reader view">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5C5.5 4 8.5 4 12 6c3.5-2 6.5-2 9-.5V19c-2.5-1.5-5.5-1.5-9 .5-3.5-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/></svg>
      </div>
      <div class="obtn hidden" id="star-btn" title="Bookmark this page (Ctrl+D)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
      </div>
      <div class="pill popblk hidden" id="popup-pill" title="Pop-ups were blocked on this page. Click to review the last one.">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="13" height="13" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v11"/><path d="M6 15l7-7"/></svg>
        <span id="popup-count">0</span>
      </div>
      <div class="pill shield" id="shield-pill" title="Shields">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>
        <span id="shield-count">0</span>
      </div>
    </div>

    <browser-action-list id="ext-actions" partition="persist:browser" alignment="bottom left"></browser-action-list>
    <div class="ic" id="media-btn" title="Detected media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M10 9l5 3-5 3z"/></svg><span class="badge hidden" id="media-badge">0</span></div>
    <div class="ic" id="grab-btn" title="Grab page content (images, files)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></div>
    <div class="ic" id="dl-btn" title="Downloads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M5 21h14"/></svg><span class="badge gray hidden" id="dl-badge">0</span></div>
    <div class="update-pill hidden" id="update-pill" title="A new version of NovaDM is ready">Update</div>
    <div class="ic" id="menu-btn" title="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="badge warn hidden" id="menu-badge">!</span></div>
  </div>

  <div id="bmbar" class="hidden"><div id="bm-items"></div><div class="bm more hidden" id="bm-more" title="More bookmarks">»</div></div>

  <script src="chrome.js"></script>
</body>
</html>
