<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https: http: novadm-thumb:;" />
<title>NovaDM panel</title>
<style>
:root{color-scheme:dark;--bg2:#24272e;--bg3:#2d313a;--pop:#22252c;--line:#3a3f4b;--fg:#e6e8ec;--fg2:#a6adbb;--fg3:#767d8c;--accent:#5b7cfa;--accent2:#3b6ef5;--danger:#e2574c;--ok:#35c28a;--radius:10px;}
@media (prefers-color-scheme: light){:root{color-scheme:light;--pop:#fff;--bg2:#f1f3f6;--bg3:#f6f7f9;--line:#dfe2e8;--fg:#1c1e24;--fg2:#5a6271;--fg3:#8b93a3;}}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;font:13px/1.45 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;color:var(--fg);user-select:none;}
#backdrop{position:fixed;inset:0;background:transparent;}
#pop{position:absolute;top:8px;right:12px;width:380px;max-height:calc(100% - 20px);background:var(--pop);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;}
.hdr{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);}
.hdr .t{font-weight:600;font-size:14px;}
.hdr .sp{flex:1;}
.hdr a{color:var(--accent);cursor:default;font-size:12px;}
.body{overflow:auto;padding:6px 0;}
.empty{padding:34px 16px;text-align:center;color:var(--fg3);}
.row{display:flex;gap:10px;padding:9px 14px;align-items:center;}
.row:hover{background:var(--bg2);}
.thumb{width:62px;height:38px;border-radius:6px;background:var(--bg3);background-size:cover;background-position:center;flex:none;display:flex;align-items:center;justify-content:center;color:var(--fg3);}
.meta{flex:1;min-width:0;}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;}
.tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.tag{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--bg3);color:var(--fg2);}
.tag.play{background:rgba(53,194,138,.18);color:var(--ok);}
.tag.drm{background:rgba(226,87,76,.18);color:var(--danger);}
.btn{height:28px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;cursor:default;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--bg2);}
.btn.pri{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.btn.pri:hover{background:var(--accent);}
.btn.sm{height:26px;padding:0 9px;font-size:12px;}
.iconbtn{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--fg2);flex:none;}
.iconbtn:hover{background:var(--bg2);color:var(--fg);}
select{height:24px;border-radius:6px;background:var(--bg3);color:var(--fg);border:1px solid var(--line);font:inherit;outline:none;}
.foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);color:var(--fg2);font-size:12px;}
.foot .sp{flex:1;}
.note{padding:8px 14px;color:var(--fg3);font-size:11.5px;background:var(--bg2);}
.menuitem{display:flex;align-items:center;gap:10px;padding:10px 14px;}
.sugg{padding:4px 0;}
.srow{display:flex;align-items:center;gap:10px;padding:7px 14px;}
.srow:hover,.srow.sel{background:var(--bg2);}
.srow.sel{box-shadow:inset 3px 0 0 var(--accent);}
.sic{color:var(--fg3);display:flex;flex:none;}
.stx{display:flex;gap:8px;min-width:0;align-items:baseline;}
.stt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%;flex:none;}
.surl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent);font-size:12px;min-width:0;}
.menuitem:hover{background:var(--bg2);}
.bar{height:4px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-top:6px;}
.bar > i{display:block;height:100%;background:var(--accent2);width:0;}
.seg{display:flex;background:var(--bg3);border-radius:8px;padding:2px;gap:2px;}
.seg button{flex:1;height:26px;border:none;background:transparent;color:var(--fg2);border-radius:6px;font:inherit;cursor:default;}
.seg button.on{background:var(--pop);color:var(--fg);}
.prompt{width:420px;}
.prompt .q{padding:14px;font-size:13px;line-height:1.5;}
.prompt .q b{word-break:break-all;}
.prompt .acts{display:flex;gap:8px;padding:0 14px 14px;}
.chk{display:flex;align-items:center;gap:7px;padding:0 14px 10px;color:var(--fg2);font-size:12px;}
label{cursor:default;}
/* new download dialog */
#pop.dlg{width:480px;}
.frm{padding:12px 14px 4px;display:grid;grid-template-columns:84px 1fr;gap:9px 10px;align-items:center;}
.frm .k{color:var(--fg2);font-size:12px;}
.frm .v{min-width:0;display:flex;gap:8px;align-items:center;}
.frm .v .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.inp{height:30px;width:100%;border-radius:7px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);padding:0 9px;outline:none;font:inherit;user-select:text;}
.inp:focus{border-color:var(--accent);}
.inp.num{width:96px;}
.more{padding:2px 14px 6px;}
.more summary{color:var(--accent);font-size:12px;cursor:default;list-style:none;padding:4px 0;}
.more summary::-webkit-details-marker{display:none;}
.notice{margin:6px 14px;padding:8px 10px;border-radius:8px;background:var(--bg2);font-size:12px;color:var(--fg2);display:flex;gap:8px;align-items:center;}
.notice.warn{background:rgba(226,87,76,.12);color:var(--danger);}
.notice[hidden]{display:none;}
.notice .sp{flex:1;}
.acts .sp{flex:1;}
.btn:disabled{opacity:.5;}
.links{max-height:300px;overflow:auto;padding:4px 8px;}
/* content grabber */
#pop.grab{display:flex;flex-direction:column;}
#pop.grab #content{display:flex;flex-direction:column;flex:1;min-height:0;padding:0;}
.gbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.gbar .sp{flex:1;}
.chips{display:flex;gap:4px;flex-wrap:wrap;}
.chip{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg2);font:inherit;font-size:12px;cursor:default;}
.chip.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:transparent;color:var(--accent);}
.gsearch{height:28px;width:180px;border-radius:7px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);padding:0 9px;outline:none;font:inherit;font-size:12px;}
.gbody{flex:1;min-height:0;overflow:auto;padding:10px 14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;}
.tile{position:relative;border-radius:9px;overflow:hidden;background:var(--bg3);border:2px solid transparent;aspect-ratio:1/1;cursor:default;}
.tile.sel{border-color:var(--accent2);}
.tile img{width:100%;height:100%;object-fit:cover;display:block;}
.tile .dim{position:absolute;left:6px;bottom:6px;font-size:10.5px;padding:1px 6px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;}
.tile .ck{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:6px;background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;color:#fff;}
.tile.sel .ck{background:var(--accent2);border-color:var(--accent2);}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:7px;}
.lrow:hover{background:var(--bg2);}
.lrow input{flex:none;}
.lrow .nm2{flex:1;min-width:0;}
.lrow .nm2 div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lrow .nm2 .u{color:var(--fg3);font-size:11.5px;}
.spinner{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 10px;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div id="backdrop"></div>
  <div id="pop"><div class="body" id="content"></div></div>
  <script src="panel.js"></script>
</body>
</html>
