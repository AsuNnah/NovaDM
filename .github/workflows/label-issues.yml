# Adds a label to a new issue from its text (.github/labeler.yml): an issue that contains the app's
# "Report a problem" file gets `problem-report`, so those are easy to find. Modelled on brave-browser's
# assign-issue-labels workflow.
name: Label issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@c1b0f9f52a63158c4adc09425e858e87b32e9685 # v3.4
        with:
          enable-versioned-regex: 0
          include-title: 1
          configuration-path: .github/labeler.yml
          # sync-labels is left off: it would also remove labels added by hand
