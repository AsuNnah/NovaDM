# Stage 6 of docs/pipeline.md: free security scanners, no API keys and no cost. Their findings go to
# the Security tab (code scanning) next to CodeQL's. They don't block merging: the required checks
# stay `test` and `analyze`; new findings are triaged like CodeQL alerts (fix, or dismiss with a reason).
#  - Electronegativity: Electron misconfigurations (window options, isolation, IPC, navigation).
#  - Semgrep (Community Edition): JavaScript / Node.js security rules, different from CodeQL's.
#  - OSV-Scanner: known vulnerabilities in package-lock.json (OSV database).
#  - OpenSSF Scorecard: how the repository itself is protected (main branch and weekly only).
name: Security scans

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 2' # weekly, so new rules and advisories also check old code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electronegativity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # Checks left out, after review (docs/security.md):
      #  CSPGlobalCheck, CSPHTMLCheck: "review your CSP" notes; every UI page has a strict one in a meta tag
      #    (default-src 'none', script-src 'self'), the usual place for NovaDM's local pages.
      #  CustomArgumentsJSCheck: the Chromium switches are hardening on purpose (third-party cookies off, no JIT in Safer/Safest).
      - name: Electronegativity (pinned version)
        run: npx --yes @doyensec/electronegativity@1.10.3 --input src --relative --electron-version 45.0.0 --exclude-checks CSPGlobalCheck,CSPHTMLCheck,CustomArgumentsJSCheck --output electronegativity.sarif
      - name: Send the results to code scanning
        if: always() && hashFiles('electronegativity.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: electronegativity.sarif
          category: electronegativity

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Semgrep (pinned version)
        run: pip install semgrep==1.177.0
      # Only the code that ships (src, the browser extension); tools/ and test/ are local test scripts.
      # regex_dos is left out: it flags every regex that sees outside text, also simple anchored ones;
      # CodeQL's ReDoS queries (security-extended) check real catastrophic backtracking.
      # Other false positives are dismissed in GitHub with the reason (docs/security.md). In-code
      # `nosemgrep` comments don't close alerts uploaded as SARIF, and editing a flagged line makes
      # CodeQL see a new alert there.
      - name: Semgrep
        run: semgrep scan --config p/javascript --config p/nodejsscan --exclude-rule ajinabraham.njsscan.dos.regex_dos.regex_dos --metrics=off --sarif --output semgrep.sarif src browser-extension
      - name: Send the results to code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  osv-scanner:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=package-lock.json
      fail-on-vuln: false # reported in the Security tab; Dependabot opens the fix

  scorecard:
    # Scorecard only rates the default branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: Send the results to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
