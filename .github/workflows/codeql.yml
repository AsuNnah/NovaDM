# Stage 6 of docs/pipeline.md: static security analysis of NovaDM's own JavaScript.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # weekly, so new CodeQL rules also check old code

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions: # only this job writes results (OpenSSF Scorecard: least privilege)
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
