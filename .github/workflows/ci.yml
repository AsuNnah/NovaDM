# Stages 4 and 6 of docs/pipeline.md on every push to main and every pull request. Also called by
# release.yml before a version is built.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the privacy check reads the whole history
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron 44 fetches its program on first use; do it once here, or test files that start
      # Electron in parallel race to unpack it.
      - name: Install Electron
        run: node node_modules/electron/install.js
      - name: Unit tests
        run: npm test
      - name: Known vulnerabilities in dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: No personal data
        run: node tools/check-private.js
