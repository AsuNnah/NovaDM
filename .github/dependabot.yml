# Maintenance: pull requests for dependency updates (Electron security fixes
# arrive this way). Each one goes through CI before it is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Every github/codeql-action step in a workflow must run the same version (CodeQL refuses a mix).
      codeql-action:
        patterns: ["github/codeql-action*"]
